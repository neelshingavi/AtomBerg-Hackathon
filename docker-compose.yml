version: "3.9"
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atomquest
    ports:
      - "5432:5432"
    volumes:
      - atomquest_pg:/var/lib/postgresql/data

volumes:
  atomquest_pg:
